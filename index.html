<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حياتي</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{color-scheme:dark;--h2:#3a0a16;--soft:var(--soft);--soft2:#e0a3b2;--lb:#2a1118;--nav:rgba(10,8,9,.94);--bg:#0a0809;--card:#161113;--card2:#1f1619;--line:#2c2024;--bur:#8b1a34;--bur2:#b3264a;--tx:#f1e9ea;--mu:#9a8a8d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:18px 16px}
.tab{display:none;animation:up .35s ease}.tab.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1{font-size:26px;margin:6px 0 2px}h2{font-size:15px;color:var(--mu);margin:22px 0 8px;font-weight:600}
.sub{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero{background:linear-gradient(145deg,var(--bur),var(--h2) 70%);border:0;text-align:center;padding:22px 14px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:1px;direction:ltr}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.p{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.p.next{border-color:var(--bur2);box-shadow:0 0 0 1px var(--bur2) inset}
.p .t{margin-inline-start:auto;direction:ltr;color:var(--mu)}
.ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--mu);display:grid;place-items:center;font-size:14px;color:#fff}
.p.done .ck{background:var(--bur2);border-color:var(--bur2)}.p.done .n{text-decoration:line-through;color:var(--mu)}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bur),var(--bur2));border-radius:9px;transition:width .4s}
button,.btn{background:var(--bur);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer}
button.g{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
input,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;outline:0}
input:focus,textarea:focus{border-color:var(--bur2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px;margin:4px 0}.stat input{text-align:center;font-size:20px;font-weight:700;background:none;border:0;padding:2px}
.heart{font-size:54px;font-weight:700;direction:ltr}.beat{display:inline-block;animation:b 1s infinite}
@keyframes b{50%{transform:scale(1.2)}}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.note small{display:block;color:var(--mu);margin-top:6px;font-size:11px}
.tag{color:var(--bur2);cursor:pointer;font-weight:600}.lnk{color:var(--soft2);background:var(--lb);border-radius:5px;padding:0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer}.chip.on{background:var(--bur);border-color:var(--bur);color:#fff}.hero{color:#fff}
.x{background:none;color:var(--mu);padding:2px 8px}
nav{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-around;background:var(--nav);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;flex:1;padding:6px 0;border-radius:12px}
nav button span{font-size:22px;filter:grayscale(1) opacity(.7);transition:.2s}
nav button.on{color:var(--tx)}nav button.on span{filter:none;transform:translateY(-3px) scale(1.15)}
nav button.on::after{content:"";width:22px;height:3px;border-radius:3px;background:var(--bur2)}
.top{display:flex;justify-content:space-between;align-items:center}#menu{display:none;position:absolute;inset-inline-start:16px;top:56px;background:var(--card2);border:1px solid var(--line);border-radius:12px;z-index:9;min-width:180px}#menu div{padding:13px 16px;cursor:pointer}#menu.on{display:block}.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 40px;display:none}.ov.on{display:block}.bars{display:flex;gap:6px;align-items:flex-end;height:120px}.bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu);gap:3px}.bc i{width:100%;background:linear-gradient(var(--bur2),var(--bur));border-radius:5px 5px 0 0;min-height:3px}.x{font-size:13px;color:var(--soft2)!important}.up{color:#6fcf97}.dn{color:#eb5757}
select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.msg{font-size:12px;color:var(--mu);margin-top:8px}
html[data-ac=green]{--bur:#1f7a4a;--bur2:#2fa86a;--h2:#0b2e1c;--soft:#c9f0dc;--soft2:#9fdcbc;--lb:#10281c}
html[data-th=light]{color-scheme:light;--bg:#f6f1f1;--card:#fff;--card2:#efe7e8;--line:#e2d6d8;--tx:#241a1c;--mu:#7a6a6d;--nav:rgba(255,255,255,.94);--lb:#f3dfe4;--soft2:#8b1a34}
html[data-th=light][data-ac=green]{--lb:#d9f0e3;--soft2:#1f7a4a}
</style>
</head>
<body>
<main>
<div class="top"><b style="font-size:18px">حياتي</b><button class="g" id="mn">⋮</button></div><div id="menu"><div data-m="an">📊 تحليل الإنجازات</div><div data-m="sn">🔔 النغمات</div><div data-m="th">🎨 المظهر</div><div data-m="lg">🌐 English</div><div data-m="ac">👤 الحساب</div></div>
<section class="tab on" id="t0"></section>
<section class="tab" id="t1"></section>
<section class="tab" id="t2"></section>
<section class="tab" id="t3"></section>
</main>
<div class="ov" id="ov"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
let S={pomo:[],pray:{},wird:{goal:5,days:{}},health:{},goals:[],notes:[]};
try{const r=localStorage.getItem('life1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let ref=null,tm,acct='';
const save=()=>{try{localStorage.setItem('life1',JSON.stringify(S))}catch(e){}push()};
function push(){if(!ref)return;clearTimeout(tm);tm=setTimeout(()=>{try{ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{})}catch(e){}},800)}
const day=()=>new Date().toLocaleDateString('en-CA');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tabs=[['🕌','الدين'],['❤️','الصحة'],['🌱','تطوير ذات'],['💭','فكرة']];
$('#nav').innerHTML=tabs.map((t,i)=>`<button data-i="${i}"><span>${t[0]}</span>${t[1]}</button>`).join('');
function go(i){document.querySelectorAll('.tab').forEach((e,k)=>e.classList.toggle('on',k==i));document.querySelectorAll('nav button').forEach((e,k)=>e.classList.toggle('on',k==i));scrollTo(0,0);try{localStorage.setItem('lifetab',i)}catch(e){}}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};

/* ---------- prayer times (Egyptian General Authority method) ---------- */
let LAT=30.04,LON=31.24,locFail=false;if(S.loc){LAT=S.loc[0];LON=S.loc[1]}
function locate(){if(!navigator.geolocation){locFail=true;return renderDeen()}navigator.geolocation.getCurrentPosition(p=>{S.loc=[+p.coords.latitude.toFixed(4),+p.coords.longitude.toFixed(4)];LAT=S.loc[0];LON=S.loc[1];locFail=false;save();renderDeen()},()=>{locFail=true;renderDeen()},{timeout:12000,maximumAge:3e5})}
const rad=Math.PI/180,sin=x=>Math.sin(x*rad),cos=x=>Math.cos(x*rad),tan=x=>Math.tan(x*rad);
function times(d){
  const tz=-d.getTimezoneOffset()/60;
  const jd=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)/864e5+2440587.5-2451545;
  const g=(357.529+.98560028*jd)%360,q=(280.459+.98564736*jd)%360;
  const L=q+1.915*sin(g)+.02*sin(2*g),e=23.439-4e-7*jd;
  let ra=Math.atan2(cos(e)*sin(L),cos(L))/rad/15;ra=((ra%24)+24)%24;
  let eq=q/15-ra;eq=((eq+12)%24+24)%24-12;
  const dec=Math.asin(sin(e)*sin(L))/rad;
  const dh=12+tz-LON/15-eq;
  const T=a=>Math.acos((-sin(a)-sin(dec)*sin(LAT))/(cos(dec)*cos(LAT)))/rad/15;
  const A=Math.atan(1/(1+tan(Math.abs(LAT-dec))))/rad*0+(90-Math.atan(1+tan(Math.abs(LAT-dec)))/rad);
  const asr=dh+Math.acos((sin(A)-sin(dec)*sin(LAT))/(cos(dec)*cos(LAT)))/rad/15;
  return [['الفجر',dh-T(19.5)],['الظهر',dh+.03],['العصر',asr],['المغرب',dh+T(.833)+.05],['العشاء',dh+T(17.5)]];
}
const fmt=h=>{let m=Math.round(((h%24)+24)%24*60),hh=Math.floor(m/60),mm=m%60,ap=S.lang=='en'?(hh>=12?'PM':'AM'):(hh>=12?'م':'ص');hh=hh%12||12;return hh+':'+String(mm).padStart(2,'0')+' '+ap};
function nextP(){const n=new Date(),h=n.getHours()+n.getMinutes()/60+n.getSeconds()/3600,t=times(n);
  for(let i=0;i<5;i++)if(t[i][1]>h)return{i,left:t[i][1]-h};
  return{i:0,left:t[0][1]+24-h}}
const hms=h=>{const s=Math.max(0,Math.round(h*3600));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')};

function renderDeen(){
  const t=times(new Date()),nx=nextP(),k=day(),pd=S.pray[k]||{};
  const hij=new Intl.DateTimeFormat((S.lang=='en'?'en-US':'ar-EG')+'-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
  const done=t.filter((_,i)=>pd[i]).length,w=S.wird.days[k]||0,g=S.wird.goal;
  $('#t0').innerHTML=`<h1>الدين 🕌</h1><div class="sub">${hij}</div>
  <div class="card hero" style="margin-top:14px"><div class="sub" style="color:var(--soft)">الصلاة الجاية: ${t[nx.i][0]}</div><div class="big" id="cd">${hms(nx.left)}</div><div class="sub" style="color:var(--soft)">${fmt(t[nx.i][1])}</div></div>
  <h2>صلواتي النهاردة — ${done}/5</h2>
  ${t.map((p,i)=>`<div class="p ${pd[i]?'done':''} ${i==nx.i?'next':''}" data-p="${i}"><div class="ck">${pd[i]?'✓':''}</div><span class="n">${p[0]}</span><span class="t">${fmt(p[1])}</span></div>`).join('')}
  <h2>وردي القرآني</h2>
  <div class="card"><div class="row"><b>${w} / ${g} صفحة</b><span class="sub">الهدف اليومي</span></div>
  <div class="bar"><i style="width:${Math.min(100,w/g*100)}%"></i></div>
  <div class="row"><div style="display:flex;gap:8px"><button class="g" data-w="-1">−</button><button data-w="1">+ صفحة</button></div><div style="display:flex;gap:6px;align-items:center"><span class="sub">الهدف</span><input id="goal" type="number" min="1" value="${g}" style="width:64px;text-align:center"></div></div>
  <div class="chips" style="margin-top:12px">${[6,5,4,3,2,1,0].map(o=>{const d=new Date();d.setDate(d.getDate()-o);const v=S.wird.days[d.toLocaleDateString('en-CA')]||0;return `<span class="chip ${v>=g?'on':''}">${v}</span>`}).join('')}</div><div class="sub">آخر ٧ أيام</div></div>
  <button class="g" id="loc" style="width:100%;margin-top:14px">📍 حدّد موقعي</button><div class="msg">${S.loc?`المواعيد محسوبة لموقعك الحالي (${S.loc[0]}, ${S.loc[1]}).`:locFail?"ما قدرتش أعرف موقعك — اسمح بالوصول للموقع واضغط الزرار. دلوقتي بستخدم القاهرة مؤقتاً.":"بحدد موقعك…"} طريقة الحساب: الهيئة المصرية العامة للمساحة.</div>`;
}
$('#t0').onclick=e=>{
  if(e.target.id=='loc')locate();
  const p=e.target.closest('[data-p]');if(p){const k=day();S.pray[k]=S.pray[k]||{};S.pray[k][p.dataset.p]=!S.pray[k][p.dataset.p];if(S.pray[k][p.dataset.p])snd(Object.values(S.pray[k]).filter(Boolean).length==5?'big':'ok');save();renderDeen()}
  const w=e.target.closest('[data-w]');if(w){const k=day();S.wird.days[k]=Math.max(0,(S.wird.days[k]||0)+ +w.dataset.w);if(+w.dataset.w>0)snd(S.wird.days[k]==S.wird.goal?'big':'ok');save();renderDeen()}};
$('#t0').onchange=e=>{if(e.target.id=='goal'){S.wird.goal=Math.max(1,+e.target.value||1);save();renderDeen()}};
setInterval(()=>{const c=$('#cd');if(c){const n=nextP();c.textContent=hms(n.left);if(n.left<1/3600*1.5)renderDeen()}},1000);

/* ---------- health ---------- */
let bpm=null,bleMsg='';
function renderHealth(){
  const H=S.health,k=day(),v=H[k]||{};
  $('#t1').innerHTML=`<h1>الصحة ❤️</h1><div class="sub">متابعة من ساعة Oraimo</div>
  <div class="card hero" style="margin-top:14px"><div class="heart"><span class="beat">❤</span> ${bpm??'--'}</div><div class="sub" style="color:var(--soft)">نبضة / دقيقة</div></div>
  <button id="ble" style="width:100%">🔗 اربط الساعة (Bluetooth)</button><div class="msg">${bleMsg||'فعّل Bluetooth في الساعة وخليها قريبة. الاتصال المباشر بيشتغل لو الساعة بتبث النبض بشكل معياري.'}</div>
  <h2>أرقام النهاردة (تقدر تدخلها من تطبيق Oraimo)</h2>
  <div class="grid">${[['steps','👟','خطوات'],['sleep','😴','ساعات نوم'],['spo2','🫁','أكسجين %'],['water','💧','أكواب مية']].map(s=>`<div class="stat">${s[1]}<input data-h="${s[0]}" type="number" inputmode="decimal" placeholder="0" value="${v[s[0]]??''}"><span class="sub">${s[2]}</span></div>`).join('')}</div>`;
}
$('#t1').onchange=e=>{const h=e.target.dataset.h;if(h){const k=day();S.health[k]=S.health[k]||{};S.health[k][h]=e.target.value;save()}};
$('#t1').onclick=async e=>{if(e.target.id!='ble')return;
  try{if(!navigator.bluetooth)throw 0;
    const d=await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});
    const s=await d.gatt.connect(),sv=await s.getPrimaryService('heart_rate'),c=await sv.getCharacteristic('heart_rate_measurement');
    await c.startNotifications();c.addEventListener('characteristicvaluechanged',ev=>{const dv=ev.target.value;bpm=dv.getUint8(0)&1?dv.getUint16(1,true):dv.getUint8(1);const el=$('.heart');if(el)el.innerHTML=`<span class="beat">❤</span> ${bpm}`});
    bleMsg='✅ متصل بـ '+(d.name||'الساعة');renderHealth();
  }catch(err){bleMsg='ما قدرتش أتصل. جرّب Chrome على أندرويد، وافتح الصفحة في المتصفح مباشرة. لو الساعة مش بتبث النبض، أدخل الأرقام يدوي.';renderHealth()}};

/* ---------- growth ---------- */
function renderGrowth(){
  $('#t2').innerHTML=`<h1>تطوير ذات 🌱</h1><div class="sub">كورسات ومهارات بشتغل عليها</div>${pomoCard()}
  <div class="row" style="margin:14px 0"><input id="gn" placeholder="كورس أو مهارة جديدة…"><button id="ga">+</button></div>
  ${S.goals.length?S.goals.map((g,i)=>`<div class="card"><div class="row"><b data-u>${esc(g.n)}</b><span><span class="sub">${g.p}%</span><button class="x" data-d="${i}">✕</button></span></div><div class="bar"><i style="width:${g.p}%"></i></div><input type="range" min="0" max="100" step="5" value="${g.p}" data-r="${i}" style="accent-color:var(--bur2);padding:0"></div>`).join(''):'<div class="card sub">لسه فاضي — ضيف أول كورس أو مهارة.</div>'}`;
}
$('#t2').onclick=e=>{
  if(e.target.id=='ga'){const v=$('#gn').value.trim();if(v){S.goals.unshift({n:v,p:0});snd('ok');save();renderGrowth()}}
  if(e.target.dataset.d!==undefined){S.goals.splice(+e.target.dataset.d,1);save();renderGrowth()}};
$('#t2').oninput=e=>{if(e.target.dataset.r!==undefined){const g=S.goals[+e.target.dataset.r];const o=g.p;g.p=+e.target.value;if(o<100&&g.p>=100)snd('big');save();const c=e.target.closest('.card');c.querySelector('.bar i').style.width=g.p+'%';c.querySelector('.sub').textContent=g.p+'%'}};

/* ---------- ideas ---------- */
let tagF=null,ed=null;
const rich=s=>esc(s).replace(/#([^\s#\[\]]+)/g,'<span class="tag" data-g="$1">#$1</span>').replace(/\[\[([^\]]+)\]\]/g,'<span class="lnk">$1</span>');
function renderIdeas(){
  const all=[...new Set(S.notes.flatMap(n=>(n.t.match(/#[^\s#\[\]]+/g)||[]).map(x=>x.slice(1))))];
  const list=S.notes.filter(n=>!tagF||n.t.includes('#'+tagF));
  $('#t3').innerHTML=`<h1>فكرة 💭</h1><span class="chip" style="display:inline-block;margin-top:8px">${acct||'💾 محفوظ على جهازك فقط'}</span>
  <div class="card" style="margin-top:14px"><textarea id="nt" rows="3" placeholder="إيه اللي في بالك؟"></textarea><div class="row" style="margin-top:8px"><span class="sub">${S.notes.length} ملاحظة</span><button id="na">نشر</button></div></div>
  ${all.length?`<div class="chips"><span class="chip ${tagF?'':'on'}" data-g="">الكل</span>${all.map(t=>`<span class="chip ${tagF==t?'on':''}" data-g="${esc(t)}" data-u>#${esc(t)}</span>`).join('')}</div>`:''}
  ${list.map(n=>n.d===ed?`<div class="note"><textarea id="et" rows="4">${esc(n.t)}</textarea><div class="row" style="margin-top:8px"><button class="g" data-c="1">إلغاء</button><button data-s="${n.d}">حفظ</button></div></div>`:`<div class="note"><span data-u>${rich(n.t)}</span><small>${new Date(n.d).toLocaleString(S.lang=='en'?'en-US':'ar-EG',{dateStyle:'medium',timeStyle:'short'})}${n.e?' • اتعدّلت':''}</small><div style="display:flex;gap:8px;margin-top:10px"><button data-ed="${n.d}">✏️ تعديل</button><button class="g" data-x="${n.d}">🗑️ حذف</button></div></div>`).join('')}`;
}
$('#t3').onclick=e=>{const D=e.target.dataset;
  if(e.target.id=='na'){const v=$('#nt').value.trim();if(v){S.notes.unshift({t:v,d:Date.now()});snd('ok');save();renderIdeas()}}
  if(D.g!==undefined){tagF=D.g||null;renderIdeas()}
  if(D.ed){ed=+D.ed;renderIdeas()}
  if(D.c){ed=null;renderIdeas()}
  if(D.s){const n=S.notes.find(n=>n.d==D.s),v=$('#et').value.trim();if(n&&v){n.t=v;n.e=Date.now();snd('ok')}ed=null;save();renderIdeas()}
  if(D.x&&confirm(TR('متأكد إنك عايز تحذف؟'))){S.notes=S.notes.filter(n=>n.d!=D.x);save();renderIdeas()}};

/* ---------- sounds ---------- */
var AC;
const M={ding:[[880,0,.3],[1320,.15,.5]],arp:[[523,0,.15],[659,.12,.15],[784,.24,.15],[1047,.36,.5]],coin:[[988,0,.08],[1319,.08,.4]],soft:[[440,0,.4],[554,.3,.4],[659,.6,.6]],alarm:[[880,0,.2],[660,.25,.2],[880,.5,.2],[660,.75,.3]],fan:[[392,0,.12],[392,.15,.12],[392,.3,.12],[523,.45,.6]]};
const DEF={ok:'ding',big:'arp',end:'fan',brk:'alarm'};
function snd(t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
 const Q=t=='tick'?[[700,0,.08]]:M[(S.sn||{})[t]||DEF[t]];if(!Q)return;
 Q.forEach(([f,d,l])=>{const o=AC.createOscillator(),g=AC.createGain(),a=AC.currentTime+d;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,a);g.gain.linearRampToValueAtTime(.25,a+.02);g.gain.exponentialRampToValueAtTime(.001,a+l+.15);o.connect(g);g.connect(AC.destination);o.start(a);o.stop(a+l+.2)})}catch(e){}}

/* ---------- pomodoro ---------- */
let pm={m:'w',left:1500,run:0,end:0};
const mmss=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function pomoCard(){const t=S.pomo.filter(p=>new Date(p.d).toLocaleDateString('en-CA')==day()).length;
return `<div class="card hero" style="margin-top:14px"><div class="sub" style="color:var(--soft)">${pm.m=='w'?'تركيز 🍅':'راحة ☕'} — جلسات النهاردة: ${t}</div><div class="big" id="pt">${mmss(pm.left)}</div><div style="display:flex;gap:8px;justify-content:center;margin:10px 0"><button id="ps">${pm.run?'إيقاف':'ابدأ'}</button><button class="g" id="pr">إعادة</button></div><div class="row"><span class="sub">تركيز (د)</span><input id="pw" type="number" min="1" value="${S.pw||25}" style="width:70px;text-align:center"><span class="sub">راحة (د)</span><input id="pb" type="number" min="1" value="${S.pb||5}" style="width:70px;text-align:center"></div></div>`}
$('#t2').addEventListener('click',e=>{const id=e.target.id;
 if(id=='ps'){snd('tick');if(pm.run){pm.left=Math.max(0,Math.round((pm.end-Date.now())/1000));pm.run=0}else{pm.end=Date.now()+pm.left*1000;pm.run=1}renderGrowth()}
 if(id=='pr'){pm={m:'w',left:(S.pw||25)*60,run:0,end:0};renderGrowth()}});
$('#t2').addEventListener('change',e=>{const id=e.target.id;if(id!='pw'&&id!='pb')return;S[id]=Math.max(1,+e.target.value||1);if(!pm.run)pm.left=(pm.m=='w'?S.pw||25:S.pb||5)*60;save();renderGrowth()});
setInterval(()=>{if(!pm.run)return;pm.left=Math.max(0,Math.round((pm.end-Date.now())/1000));const t=$('#pt');if(t)t.textContent=mmss(pm.left);document.title=mmss(pm.left)+' 🍅';
 if(!pm.left){if(pm.m=='w'){S.pomo.push({d:Date.now(),m:S.pw||25});save();snd('end');pm.m='b';pm.left=(S.pb||5)*60}else{snd('brk');pm.m='w';pm.left=(S.pw||25)*60}pm.run=0;document.title=TR('حياتي');try{navigator.vibrate([300,100,300])}catch(e){}renderGrowth()}},1000);

/* ---------- menu + analytics ---------- */
const dk=o=>{const d=new Date();d.setDate(d.getDate()-o);return d.toLocaleDateString('en-CA')};
const DN=()=>S.lang=='en'?['S','M','T','W','T','F','S']:['ح','ن','ث','ر','خ','ج','س'];
const pf=k=>Object.values(S.pray[k]||{}).filter(Boolean).length,wf=k=>S.wird.days[k]||0;
const ff=k=>S.pomo.filter(p=>new Date(p.d).toLocaleDateString('en-CA')==k).reduce((a,p)=>a+p.m,0);
const sum=(f,o)=>Array.from({length:7},(_,i)=>f(dk(o+i))).reduce((a,b)=>a+b,0);
function chart(t,f,max,u){const a=sum(f,0),b=sum(f,7),d=b?Math.round((a-b)/b*100):null;
 return `<h2>${t}</h2><div class="card"><div class="bars">${Array.from({length:7},(_,i)=>{const k=dk(6-i),v=f(k);return `<div class="bc">${v}<i style="height:${Math.max(3,Math.min(v,max)/max*70)}%"></i>${DN()[new Date(k+'T12:00').getDay()]}</div>`}).join('')}</div><div class="sub" style="margin-top:8px">الأسبوع: ${a} ${u} ${d===null?'':`<span class="${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${Math.abs(d)}% عن الأسبوع اللي فات</span>`}</div></div>`}
function ovShow(h){$('#ov').innerHTML='<button class="g" id="cl">✕ إغلاق</button>'+h;$('#ov').classList.add('on')}
function analytics(){let st=0;for(let o=pf(dk(0))==5?0:1;pf(dk(o))==5;o++)st++;
 const av=S.goals.length?Math.round(S.goals.reduce((a,g)=>a+g.p,0)/S.goals.length):0,dn=S.goals.filter(g=>g.p>=100);
 ovShow(`<h1>تحليل الإنجازات 📊</h1><div class="sub">آخر ٧ أيام ومقارنتها بالأسبوع اللي قبله</div><div class="grid" style="margin-top:14px">
 <div class="stat">🕌<b>${sum(pf,0)}/35</b><span class="sub">صلوات الأسبوع</span></div><div class="stat">🔥<b>${st}</b><span class="sub">أيام صلوات كاملة متتالية</span></div>
 <div class="stat">📖<b>${Array.from({length:7},(_,i)=>wf(dk(i))>=S.wird.goal).filter(Boolean).length}/7</b><span class="sub">أيام حققت هدف الورد</span></div><div class="stat">🍅<b>${(sum(ff,0)/60).toFixed(1)}</b><span class="sub">ساعات تركيز الأسبوع</span></div>
 <div class="stat">🌱<b>${av}%</b><span class="sub">متوسط تقدم أهدافي</span></div><div class="stat">💭<b>${S.notes.length}</b><span class="sub">ملاحظة</span></div></div>
 ${chart('الصلوات يومياً',pf,5,'صلاة')}${chart('الورد (صفحات)',wf,Math.max(S.wird.goal,...Array.from({length:7},(_,i)=>wf(dk(i)))),'صفحة')}${chart('دقائق التركيز',ff,Math.max(60,...Array.from({length:7},(_,i)=>ff(dk(i)))),'دقيقة')}
 <h2>أهداف خلصتها ✅</h2>${dn.length?dn.map(g=>`<div class="card">${esc(g.n)}</div>`).join(''):'<div class="card sub">لسه ما فيش — كمّل أهدافك لـ ١٠٠٪.</div>'}`)}
function account(){ovShow(!fa?'<h1>الحساب</h1><div class="card">الحساب لسه مش مفعّل. لازم تضيف إعدادات Firebase بتاعتك في متغير FB في أول السكريبت.</div>':usr?`<h1>الحساب</h1><div class="card">${esc(usr.email||usr.displayName||'')}<div class="msg">بياناتك متزامنة على حسابك.</div></div><button data-a="out">تسجيل الخروج</button>`:`<h1>الحساب</h1><div class="card"><input id="em" type="email" placeholder="الإيميل" style="margin-bottom:8px;direction:ltr"><input id="pw2" type="password" placeholder="الباسورد" style="direction:ltr"><div style="display:flex;gap:8px;margin-top:10px"><button data-a="in">دخول</button><button class="g" data-a="up">حساب جديد</button></div></div><button class="g" data-a="g" style="width:100%">دخول بحساب Google</button><div class="msg" id="am"></div>`)}
$('#mn').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('on')};
document.addEventListener('click',()=>$('#menu').classList.remove('on'));
$('#menu').onclick=e=>{const m=e.target.dataset.m;if(m=='an')analytics();if(m=='ac')account();if(m=='sn')sounds();if(m=='th')appearance();if(m=='lg'){S.lang=S.lang=='en'?'ar':'en';save();applyLang()}};
function sounds(){const L={ok:'إنجاز صغير (تأشير صلاة، صفحة ورد…)',big:'إنجاز كبير (هدف أو ٥ صلوات)',end:'نهاية جلسة التركيز',brk:'نهاية الراحة'},N={ding:'جرس',arp:'سلم صاعد',coin:'لعبة',soft:'هادئة',alarm:'تنبيه',fan:'فانفير',off:'بدون صوت'};
 ovShow(`<h1>النغمات 🔔</h1><div class="sub">اختار نغمة لكل حدث — بتسمعها فوراً</div><div style="height:12px"></div>${Object.keys(L).map(k=>`<div class="card"><div class="sub" style="margin-bottom:8px">${L[k]}</div><div class="row"><select data-sn="${k}" style="flex:1">${Object.keys(N).map(n=>`<option value="${n}" ${((S.sn||{})[k]||DEF[k])==n?'selected':''}>${N[n]}</option>`).join('')}</select><button data-pv="${k}">▶</button></div></div>`).join('')}`)}
$('#ov').addEventListener('change',e=>{const k=e.target.dataset.sn;if(k){S.sn=S.sn||{};S[('sn')][k]=e.target.value;save();snd(k)}});
$('#ov').onclick=async e=>{if(e.target.id=='cl')return $('#ov').classList.remove('on');if(e.target.dataset.pv)return snd(e.target.dataset.pv);const D0=e.target.dataset;if(D0.sth){S.th=D0.sth;save();applyTheme();return appearance()}if(D0.sac){S.ac=D0.sac;save();applyTheme();return appearance()}const a=e.target.dataset.a;if(!a||!fa)return;
 try{if(a=='in')await fa.signInWithEmailAndPassword($('#em').value,$('#pw2').value);if(a=='up')await fa.createUserWithEmailAndPassword($('#em').value,$('#pw2').value);if(a=='g')await fa.signInWithPopup(new firebase.auth.GoogleAuthProvider());if(a=='out')await fa.signOut();$('#ov').classList.remove('on')}catch(er){const m=$('#am');if(m)m.textContent=er.message}};

/* ---------- language + theme ---------- */
const DICT=`الفجر=Fajr|الظهر=Dhuhr|العصر=Asr|المغرب=Maghrib|العشاء=Isha|حياتي=My Life|📊 تحليل الإنجازات=📊 Achievements analysis|🔔 النغمات=🔔 Sounds|المظهر=Appearance|الحساب=Account|الدين=Faith|الصحة=Health|تطوير ذات=Growth|فكرة=Ideas|الصلاة الجاية:=Next prayer:|صلواتي النهاردة=Today's prayers|وردي القرآني=My Quran wird|+ صفحة=+ Page|صفحة=pages|الهدف اليومي=Daily goal|الهدف=Goal|آخر ٧ أيام ومقارنتها بالأسبوع اللي قبله=Last 7 days compared with the week before|آخر ٧ أيام=Last 7 days|📍 حدّد موقعي=📍 Locate me|المواعيد محسوبة لموقعك الحالي=Times calculated for your current location|ما قدرتش أعرف موقعك — اسمح بالوصول للموقع واضغط الزرار. دلوقتي بستخدم القاهرة مؤقتاً.=Couldn't get your location — allow location access and tap the button. Using Cairo for now.|بحدد موقعك…=Finding your location…|طريقة الحساب: الهيئة المصرية العامة للمساحة.=Method: Egyptian General Authority of Survey.|متابعة من ساعة=Tracking from watch|نبضة / دقيقة=beats / min|🔗 اربط الساعة (Bluetooth)=🔗 Connect watch (Bluetooth)|فعّل Bluetooth في الساعة وخليها قريبة. الاتصال المباشر بيشتغل لو الساعة بتبث النبض بشكل معياري.=Turn on Bluetooth on the watch and keep it close. Direct connection works only if the watch broadcasts heart rate in the standard way.|أرقام النهاردة (تقدر تدخلها من تطبيق Oraimo)=Today's numbers (you can enter them from the Oraimo app)|خطوات=Steps|ساعات نوم=Sleep hours|أكسجين %=Oxygen %|أكواب مية=Water cups|✅ متصل بـ =✅ Connected to |ما قدرتش أتصل. جرّب Chrome على أندرويد، وافتح الصفحة في المتصفح مباشرة. لو الساعة مش بتبث النبض، أدخل الأرقام يدوي.=Couldn't connect. Try Chrome on Android and open the page directly in the browser. If the watch doesn't broadcast heart rate, enter the numbers manually.|كورسات ومهارات بشتغل عليها=Courses and skills I'm working on|جلسات النهاردة:=Today's sessions:|تركيز (د)=Focus (min)|راحة (د)=Break (min)|تركيز=Focus|راحة=Break|ابدأ=Start|إيقاف=Pause|إعادة=Reset|كورس أو مهارة جديدة…=New course or skill…|لسه فاضي — ضيف أول كورس أو مهارة.=Nothing yet — add your first course or skill.|اتعدّلت=edited|💾 محفوظ على جهازك فقط=💾 Saved on this device only|☁️ متزامن — =☁️ Synced — |إيه اللي في بالك؟=What's on your mind?|ملاحظة=notes|نشر=Post|الكل=All|✏️ تعديل=✏️ Edit|🗑️ حذف=🗑️ Delete|إلغاء=Cancel|حفظ=Save|متأكد إنك عايز تحذف؟=Are you sure you want to delete?|تحليل الإنجازات=Achievements analysis|صلوات الأسبوع=prayers this week|أيام صلوات كاملة متتالية=days in a row with all prayers|أيام حققت هدف الورد=days the Quran goal was reached|ساعات تركيز الأسبوع=focus hours this week|متوسط تقدم أهدافي=average goal progress|الصلوات يومياً=Daily prayers|الورد (صفحات)=Quran wird (pages)|دقائق التركيز=Focus minutes|صلاة=prayers|دقيقة=min|الأسبوع:=Week:|عن الأسبوع اللي فات=vs last week|أهداف خلصتها ✅=Goals completed ✅|لسه ما فيش — كمّل أهدافك لـ ١٠٠٪.=None yet — keep going until 100%.|الحساب لسه مش مفعّل. لازم تضيف إعدادات Firebase بتاعتك في متغير FB في أول السكريبت.=Account is not enabled yet. Add your Firebase settings to the FB variable at the top of the script.|بياناتك متزامنة على حسابك.=Your data is synced to your account.|تسجيل الخروج=Sign out|الإيميل=Email|الباسورد=Password|دخول بحساب Google=Sign in with Google|دخول=Sign in|حساب جديد=New account|اختار نغمة لكل حدث — بتسمعها فوراً=Pick a sound for each event — you hear it instantly|النغمات=Sounds|إنجاز صغير (تأشير صلاة، صفحة ورد…)=Small achievement (checking a prayer, a Quran page…)|إنجاز كبير (هدف أو ٥ صلوات)=Big achievement (a goal or all 5 prayers)|نهاية جلسة التركيز=End of focus session|نهاية الراحة=End of break|جرس=Bell|سلم صاعد=Rising scale|لعبة=Game|هادئة=Calm|تنبيه=Alert|فانفير=Fanfare|بدون صوت=No sound|✕ إغلاق=✕ Close|الوضع=Mode|☀️ فاتح=☀️ Light|🌙 داكن=🌙 Dark|اللون الأساسي=Main color|🍷 برجندي=🍷 Burgundy|🌿 أخضر=🌿 Green|الساعة=the watch`.split('|').map(x=>x.split('=')).sort((a,b)=>b[0].length-a[0].length);
const E=x=>{if(!/[\u0600-\u06FF]/.test(x))return x;for(const[a,b]of DICT)if(x.includes(a))x=x.split(a).join(b);return x};
const TR=x=>S.lang=='en'?E(x):x;
const obs=new MutationObserver(()=>{if(S.lang=='en')tr()});
function tr(){obs.disconnect();try{const en=S.lang=='en',w=document.createTreeWalker(document.body,4);let n;
 while(n=w.nextNode()){const p=n.parentElement;if(!p||p.closest('[data-u],textarea,script,style'))continue;const v=n.nodeValue;let o;
  if(n._t!==undefined&&v===n._t)o=n._o;else{o=v;n._o=v}
  const r=en?E(o):o;if(r!==v)n.nodeValue=r;n._t=r}
 document.querySelectorAll('[placeholder]').forEach(el=>{if(el._p===undefined)el._p=el.getAttribute('placeholder');el.setAttribute('placeholder',en?E(el._p):el._p)})}
 finally{obs.observe(document.body,{childList:true,subtree:true,characterData:true})}}
function applyTheme(){const h=document.documentElement;h.dataset.th=S.th||'dark';h.dataset.ac=S.ac||'bur'}
function applyLang(){const en=S.lang=='en',h=document.documentElement;h.lang=en?'en':'ar';h.dir=en?'ltr':'rtl';document.title=TR('حياتي');
 $('[data-m=lg]').textContent=en?'🌐 العربية':'🌐 English';$('#ov').classList.remove('on');renderDeen();renderHealth();renderGrowth();renderIdeas();tr()}
function appearance(){const th=S.th||'dark',ac=S.ac||'bur',c=(k,v,l,cur)=>`<span class="chip ${cur==v?'on':''}" data-${k}="${v}" style="padding:10px 16px;font-size:15px">${l}</span>`;
 ovShow(`<h1>🎨 المظهر</h1><h2>الوضع</h2><div class="chips">${c('sth','light','☀️ فاتح',th)}${c('sth','dark','🌙 داكن',th)}</div><h2>اللون الأساسي</h2><div class="chips">${c('sac','bur','🍷 برجندي',ac)}${c('sac','green','🌿 أخضر',ac)}</div>`)}

/* ---------- Firebase (املا الإعدادات من console.firebase.google.com) ---------- */
const FB={apiKey:"",authDomain:"",projectId:"",appId:""};
let fa=null,fd=null,usr=null;
if(FB.apiKey&&window.firebase){firebase.initializeApp(FB);fa=firebase.auth();fd=firebase.firestore();
 fa.onAuthStateChanged(async u=>{usr=u;ref=null;acct='';
  if(u){try{const r=fd.collection('users').doc(u.uid),sn=await r.get();
   if(sn.exists){const c=sn.data(),m=new Map();[...(c.notes||[]),...S.notes].forEach(n=>{if(!m.has(n.d)||(n.e||0)>(m.get(n.d).e||0))m.set(n.d,n)});S=Object.assign(S,c);S.notes=[...m.values()].sort((a,b)=>b.d-a.d);if(S.loc){LAT=S.loc[0];LON=S.loc[1]}}
   ref=r;acct='☁️ متزامن — '+(u.displayName||u.email);save()}catch(e){}}
  applyTheme();applyLang()})}

/* ---------- init ---------- */
applyTheme();applyLang();
let st=0;try{st=+localStorage.getItem('lifetab')||0}catch(e){}go(st);
if(!S.loc)locate();
